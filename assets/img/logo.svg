<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80" role="img" aria-label="HS Mobiles">
  <defs>
    <linearGradient id="hsBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083a99"/>
      <stop offset="55%" stop-color="#0b4fc9"/>
      <stop offset="100%" stop-color="#1d5fd6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square icon badge -->
  <rect x="4" y="8" width="64" height="64" rx="16" fill="url(#hsBadgeGrad)"/>
  <!-- Geometric smartphone silhouette -->
  <rect x="19" y="16" width="34" height="48" rx="6" fill="rgba(255,255,255,0.12)" stroke="#ffffff" stroke-width="2.6"/>
  <rect x="30" y="20.5" width="12" height="2.4" rx="1.2" fill="#ffffff" opacity="0.85"/>
  <rect x="31" y="57.5" width="10" height="2.4" rx="1.2" fill="#ffffff" opacity="0.85"/>
  <!-- HS monogram inside phone -->
  <text x="36" y="45" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5" fill="#ffffff">HS</text>
  <!-- Red accent signal dot -->
  <circle cx="52" cy="19" r="5.5" fill="#e11d2a" stroke="#ffffff" stroke-width="2"/>
  <!-- Wordmark -->
  <text x="82" y="44" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.6">
    <tspan fill="#0b4fc9">HS</tspan><tspan fill="#0f172a"> Mobiles</tspan>
  </text>
  <!-- Accent underline bar -->
  <rect x="83" y="52" width="30" height="3.5" rx="1.75" fill="#e11d2a"/>
  <rect x="117" y="52" width="52" height="3.5" rx="1.75" fill="#0b4fc9" opacity="0.28"/>
  <!-- Subtext -->
  <text x="83" y="69" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.1" fill="#64748b">SMARTPHONES &amp; ACCESSORIES</text>
</svg>
